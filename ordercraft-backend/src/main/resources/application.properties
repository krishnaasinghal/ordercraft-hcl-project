spring.application.name=OrderCraft
server.port=8080

# Default: Zero-config in-memory H2 database (supports immediate execution out-of-the-box)
# To use MySQL: pass --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:ordercraft;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway is disabled by default on in-memory H2; enabled on MySQL profile
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
